# action.yml
name: 'Cloudless AWS Login'
description: 'Cloudless AWS Login'
branding:
  icon: 'log-in'
  color: 'orange'

inputs:
  cloudless-client-id:
    description: 'The Cloudless CICD Client ID'
    required: true
  cloudless-service-account:
    description: 'The Cloudless CICD Service Account'
    required: true
  cloudless-service-account-token:
    description: 'The Cloudless CICD Service Account Token'
    required: true    
  login-server-token-endpoint:
    description: 'The Cloudless login server to authenticate to'
    default: 'https://sso.cloudless.no/application/o/token/'
  aws-account-id:
    description: 'The AWS account ID to deploy into. Default to env $AWS_ACCOUNT_ID'
    required: false
  aws-region:
    description: 'What AWS region to deploy to'
    required: false
  aws-role-session-name:
    description: 'What name to use for the session'
    required: false
  aws-web-identity-token-file:
    description: 'The file storing the temporary JWT used for AWS'
    required: false
  aws-role-name:
    description: 'The AWS role name to use for the session. Defaults to CloudlessAdmin'
  verify:
    default: false
  debug:
    default: false    

runs:
  using: composite
  steps:
    #- uses: aws-actions/configure-aws-credentials@v4
    #  if: ${{ !inputs.cloudless-client-id && !inputs.cloudless-service-account-token }}
    #  with:
    #    role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || env.AWS_ACCOUNT_ID }}:role/${{ inputs.aws-role-name || 'CloudlessAdmin' }}
    #    role-session-name: ${{ inputs.aws-role-session-name || 'CloudlessActions' }}
    #    aws-region: ${{ inputs.aws-region || 'us-east-1' }}

    - shell: bash
      if: ${{ inputs.cloudless-client-id && inputs.cloudless-service-account-token }}
      run: |
        echo "Config AWS creds"
        export AWS_ROLE_SESSION_NAME=${{ inputs.aws-role-session-name || 'CloudlessActions' }}
        export AWS_REGION=${{ inputs.aws-region || 'eu-north-1' }}
        export AWS_ACCOUNT_ID=${{ inputs.aws-account-id || env.AWS_ACCOUNT_ID }}
        export AWS_ROLE_ARN=arn:aws:iam::${{ inputs.aws-account-id || env.AWS_ACCOUNT_ID }}:role/${{ inputs.aws-role-name || 'CloudlessAdmin' }}
        export AWS_WEB_IDENTITY_TOKEN_FILE=${{ inputs.aws-web-identity-token-file || '/tmp/aws-token-file' }}
        DEBUG='-s'
        if [ "${{ inputs.debug }}" == "true" ]
        then
          DEBUG='-v'
        fi
        curl $DEBUG -H "content-type: application/x-www-form-urlencoded" "${{ inputs.login-server-token-endpoint || 'https://sso.cloudless.no/application/o/token/' }}" \
          -d "grant_type=client_credentials&client_id=${{ inputs.cloudless-client-id }}&username=${{ inputs.cloudless-service-account }}&scope=profile&password=${{ inputs.cloudless-service-account-token }}" | jq -j '.id_token' > $AWS_WEB_IDENTITY_TOKEN_FILE
        echo "AWS_WEB_IDENTITY_TOKEN_FILE=$AWS_WEB_IDENTITY_TOKEN_FILE" >> $GITHUB_ENV
        echo "AWS_ROLE_SESSION_NAME=$AWS_ROLE_SESSION_NAME" >> $GITHUB_ENV
        echo "AWS_ROLE_ARN=$AWS_ROLE_ARN" >> $GITHUB_ENV
        if [ "${{ inputs.verify }}" == "true" ]
        then
          echo "Verify credentials"
          if [ "${{ inputs.debug }}" == "true" ]
          then
            cat $AWS_WEB_IDENTITY_TOKEN_FILE
          fi
          aws --version || pip3 install awscli -q -q -q --break-system-packages 
          aws sts get-caller-identity
        fi
