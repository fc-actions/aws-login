# action.yml
name: 'Cloudless AWS Login'
description: 'Cloudless AWS Login'
branding:
  icon: 'log-in'
  color: 'orange'

inputs:
  cloudless-client-id:
    description: 'The Cloudless CICD Client ID'
    required: true
  cloudless-service-account:
    description: 'The Cloudless CICD Service Account'
    required: true
  cloudless-service-account-token:
    description: 'The Cloudless CICD Service Account Token'
    required: true    
  login-server-token-endpoint:
    description: 'The Cloudless login server to authenticate to'
    default: 'https://sso.cloudless.no/application/o/token/'
  aws-account-id:
    description: 'The AWS account ID to deploy into. Default to env $AWS_ACCOUNT_ID'
    required: false
  aws-region:
    description: 'What AWS region to deploy to'
    required: false
  aws-role-session-name:
    description: 'What name to use for the session'
    required: false
  aws-web-identity-token-file:
    description: 'The file storing the temporary JWT used for AWS'
    required: false
  aws-role-name:
    description: 'The AWS role name to use for the session. Defaults to CloudlessAdmin'
  verify:
    default: false
  debug:
    default: false    

runs:
  using: composite
  steps:
    #- uses: aws-actions/configure-aws-credentials@v4
    #  if: ${{ !inputs.cloudless-client-id && !inputs.cloudless-service-account-token }}
    #  with:
    #    role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || env.AWS_ACCOUNT_ID }}:role/${{ inputs.aws-role-name || 'CloudlessAdmin' }}
    #    role-session-name: ${{ inputs.aws-role-session-name || 'CloudlessActions' }}
    #    aws-region: ${{ inputs.aws-region || 'us-east-1' }}

    - shell: bash
      if: ${{ inputs.cloudless-client-id && inputs.cloudless-service-account-token }}
      env:
        CLIENT_ID: ${{ inputs.cloudless-client-id }}
        SA_USER: ${{ inputs.cloudless-service-account }}
        SA_TOKEN: ${{ inputs.cloudless-service-account-token }}
        TOKEN_ENDPOINT: ${{ inputs.login-server-token-endpoint }}
        ACCOUNT_ID: ${{ inputs.aws-account-id || env.AWS_ACCOUNT_ID }}
        ROLE_NAME: ${{ inputs.aws-role-name || 'CloudlessAdmin' }}
        TOKEN_FILE: ${{ inputs.aws-web-identity-token-file || format('{0}/aws-token-file', runner.temp) }}
      run: |
        set -euo pipefail
        CURL_OPTS=(-sS --fail-with-body)
        [ "${{ inputs.debug }}" = "true" ] && CURL_OPTS+=(-v)

        ID_TOKEN=$(curl "${CURL_OPTS[@]}" "$TOKEN_ENDPOINT" \
          --data-urlencode "grant_type=client_credentials" \
          --data-urlencode "client_id=$CLIENT_ID" \
          --data-urlencode "username=$SA_USER" \
          --data-urlencode "password=$SA_TOKEN" \
          --data-urlencode "scope=profile" | jq -er '.id_token')
        echo "::add-mask::$ID_TOKEN"
        printf '%s' "$ID_TOKEN" > "$TOKEN_FILE"

        {
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$TOKEN_FILE"
          echo "AWS_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"
          echo "AWS_ROLE_SESSION_NAME=${{ inputs.aws-role-session-name || 'CloudlessActions' }}"
          echo "AWS_REGION=${{ inputs.aws-region || 'eu-north-1' }}"
        } >> "$GITHUB_ENV"

        if [ "${{ inputs.verify }}" = "true" ]; then
          export AWS_WEB_IDENTITY_TOKEN_FILE="$TOKEN_FILE"
          export AWS_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"
          aws --version >/dev/null 2>&1 || pip3 install awscli -q --break-system-packages
          aws sts get-caller-identity
        fi
